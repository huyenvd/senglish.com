<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=../">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Đang chuyển hướng về trang chủ...</title>
  <script>
    window.location.replace('../');
  </script>
  <style>
    :root {
      --teal-dark: #0F766E;
      --teal-light: #2DD4BF;
      --ink: #0F172A;
      --bg: #F4F7F6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: var(--bg);
      color: var(--ink);
      text-align: center;
      padding: 20px;
    }
    .box {
      background: #ffffff;
      padding: 36px 28px;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.06);
      max-width: 420px;
      width: 100%;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(15, 118, 110, 0.15);
      border-top-color: var(--teal-dark);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 18px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 {
      font-size: 18px;
      margin-bottom: 8px;
      color: var(--ink);
    }
    p {
      font-size: 14px;
      color: #64748B;
      margin-bottom: 16px;
    }
    a {
      display: inline-block;
      color: #ffffff;
      background: var(--teal-dark);
      padding: 10px 20px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition: opacity 0.2s;
    }
    a:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <h2>Đang chuyển hướng về trang chủ...</h2>
    <p>Nếu trang không tự chuyển sau vài giây, vui lòng bấm nút bên dưới.</p>
    <a href="../">&#8592; Về trang chủ S English</a>
  </div>
</body>
</html>
